<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Your Personalized Website</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f7f9;
  color:#222;
}

.container{
  max-width:850px;
  margin:auto;
  padding:30px 18px 60px;
}

.header{
  text-align:center;
  margin-bottom:30px;
}

.header h1{
  margin-bottom:8px;
}

.header p{
  color:#666;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:24px;
  margin-bottom:20px;
  box-shadow:0 8px 30px rgba(0,0,0,.06);
}

h2{
  font-size:21px;
  margin-top:0;
}

label{
  display:block;
  margin-top:14px;
  font-weight:600;
}

input,select,textarea{
  width:100%;
  margin-top:6px;
  padding:13px;
  border:1px solid #d8d8dd;
  border-radius:9px;
  font-size:15px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.ai-help{
  margin-top:8px;
  font-size:14px;
  color:#666;
}

.checkbox-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}

.checkbox-row input{
  width:auto;
}

.hidden{
  display:none;
}

.upgrades label{
  font-weight:400;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  margin:10px 0;
}

.total{
  border-top:1px solid #ddd;
  margin-top:15px;
  padding-top:15px;
  font-size:20px;
  font-weight:bold;
}

.apply-row{
  display:flex;
  gap:10px;
}

.apply-row input{
  flex:1;
}

button{
  border:0;
  border-radius:9px;
  padding:13px 18px;
  cursor:pointer;
  font-size:15px;
}

.apply-btn{
  background:#333;
  color:#fff;
}

.add-person-btn{
  margin-top:16px;
  background:#333;
  color:#fff;
  width:100%;
}

.submit-btn{
  width:100%;
  background:#222;
  color:#fff;
  padding:16px;
  font-size:17px;
  margin-top:15px;
}

.discount-msg{
  color:#16803c;
  margin-top:8px;
  font-size:14px;
}

.people-info{
  margin-top:12px;
  padding:12px;
  background:#f7f7f9;
  border-radius:9px;
  color:#666;
  font-size:14px;
  line-height:1.5;
}

.upgrade-msg{
  color:#8a5a00;
  background:#fff8e6;
  padding:12px;
  border-radius:9px;
  margin-top:12px;
  font-size:14px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>Personalized Occasion Website</h1>
<p>Create a unique, professionally designed website for your special occasion.</p>
</div>

<form id="orderForm">

<!-- CUSTOMER INFORMATION -->

<div class="card">
<h2>Customer Information</h2>

<label>Full Name</label>
<input type="text" id="customerName" required>

<label>Email Address</label>
<input type="email" id="customerEmail" required>

<label>WhatsApp Number</label>
<input type="tel" id="whatsapp" required>

<label>Country</label>
<input type="text" id="country" required>

<label>Preferred Language</label>
<select id="language">
<option value="English">English</option>
<option value="Hindi">Hindi</option>
</select>

</div>


<!-- OCCASION & PEOPLE -->

<div class="card">

<h2>Occasion & People</h2>

<label>Select Occasion</label>

<select id="occasion" required>
<option value="">Select</option>
<option value="birthday">Birthday</option>
<option value="anniversary">Anniversary</option>
<option value="proposal">Proposal</option>
<option value="valentine">Valentine's Day</option>
<option value="friendship">Friendship</option>
<option value="wedding">Wedding</option>
<option value="graduation">Graduation</option>
<option value="other">Other</option>
</select>


<!-- BIRTHDAY TYPE -->

<div id="birthdayTypeBox" class="hidden">

<label>Who is being celebrated?</label>

<select id="birthdayType">

<option value="single">
One person
</option>

<option value="group">
